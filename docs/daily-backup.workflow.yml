name: 每日内容备份与SEO巡检
on:
  schedule:
    - cron: '0 1 * * *'   # 每天北京时间9点(UTC+8=01:00)
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 记录运行时间
        run: date > last_run.txt
      - name: 提交
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "自动备份 $(date)" || echo "无变更"
          git push
